services:
  redis:
    image: redis:7-alpine
    container_name: motor-decision-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  whatsapp-adapter:
    build:
      context: .
      dockerfile: services/whatsapp-adapter/Dockerfile
    container_name: motor-decision-whatsapp-adapter
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
      - WA_SESSION_PATH=/usr/src/app/session.json
      - NODE_ENV=production
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  redis_data:
    name: motor-decision-redis-data
