services:
  redis:
    image: redis:7-alpine
    container_name: motor-decision-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped


  dev:
    image: node:20-alpine
    container_name: motor-decision-dev
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    command: tail -f /dev/null

volumes:
  redis_data:
    name: motor-decision-redis-data
